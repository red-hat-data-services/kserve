apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/kserve?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && (files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-kserve-localmodelnode-agent-pull-request.yaml".pathChanged())
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-kserve-localmodelnode-agent-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-kserve-localmodelnode-agent-on-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 8h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-kserve-localmodelnode-agent
  - name: output-image
    value: quay.io/rhoai/odh-kserve-localmodelnode-agent-rhel9:on-pr-{{pull_request_number}}
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: dockerfile
    value: Dockerfiles/localmodel-agent.Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: |
      [{"type": "rpm", "path": "."}, {"type": "gomod", "path": "."}]
  - name: build-image-index
    value: true
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhoai-version
    value: "3.6.0"
  - name: build-source-image
    value: true
  - name: rhel-subscription-activation-key
    value: "rhel-subscription-activation-key-nonexistent"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-kserve-localmodelnode-agent-v3-6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}

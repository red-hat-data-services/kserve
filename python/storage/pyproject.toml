[project]
authors = [
    {name = "The KServe Authors", email = "dsun20@bloomberg.net"},
    {name = "The KServe Authors", email = "fspolti@redhat.com"},
]
license = {text = "https://github.com/kserve/kserve/blob/master/LICENSE"}
requires-python = "<3.13,>=3.10"
dependencies = [
    # CVE-2026-34993 AIOHTTP arbitrary code execution via untrusted input to CookieJar.load()
    # CVE-2026-69244 AIOHTTP Denial of Service via malformed HTTP responses (out-of-bounds heap read)
    # CVE-2026-111064 AIOHTTP Denial of Service via missing initial request timeout
    # CVE-2026-111066 AIOHTTP Denial of Service via file descriptor exhaustion in multipart request processing
    # CVE-2026-123817 AIOHTTP Denial of Service via memory exhaustion during WebSocket frame reassembly
    "aiohttp>=3.14.4",
    "requests<3.0.0,>=2.32.2",
    "google-cloud-storage<3.0.0,>=2.14.0",
    "azure-storage-blob<13.0.0,>=12.20.0",
    "azure-storage-file-share<13.0.0,>=12.16.0",
    "azure-identity<2.0.0,>=1.15.0",
    "boto3<2.0.0,>=1.29.0",
    # Distrust eMudhra intermediate CA certificates (bz#2563310): python-botocore before
    # 1.43.117 bundles the Comodo AAA Certificate Services root CA that chains to the
    # compromised eMudhra intermediates.
    # Pinning because it is a transitive dependency.
    "botocore>=1.43.117",
    "huggingface-hub[hf-transfer]>=0.32.0",
    # CVE-2026-104851 fsspec server-side template injection in ReferenceFileSystem
    "fsspec>=2026.6.0",
    # CVE-2026-42563 Dulwich arbitrary code execution via malicious Git file paths during merge
    # CVE-2026-42305 Dulwich remote code execution via malicious Git repository (Windows path validation)
    "dulwich>=1.2.5",
    # CVE-2026-26007 cryptography Subgroup Attack Due to Missing Subgroup Validation for SECT Curves (fixed 46.0.5)
    # CVE-2026-69247 cryptography PKCS#7 EnvelopedData decryption exposes a Bleichenbacher oracle (fixed 50.0.0)
    "cryptography>=50.0.0",
    # CVE-2026-32597 PyJWT accepts unknown `crit` header extensions (RFC 7515 §4.1.11 MUST violation)
    # CVE-2026-48526 PyJWT authentication bypass via JWK accepted as HMAC secret
    # CVE-2026-102267 PyJWT verification key substitution via unvalidated JWKS redirects
    # Pinning because it is a transitive dependency.
    "pyjwt>=2.14.0",
    # CVE-2025-66471 urllib3 Streaming API improperly handles highly compressed data
    # CVE-2026-97687 urllib3 traffic interception via HTTPS proxy TLS configuration override
    # CVE-2026-97689 urllib3 Denial of Service via unbounded memory allocation in chunk parser
    # Pinning because it is a transitive dependency.
    "urllib3>=2.8.0",
    # CVE-2026-59885 / CVE-2026-30922 pyasn1 Denial of Service via crafted ASN.1 OBJECT IDENTIFIER
    # CVE-2026-119194 pyasn1 Denial of Service via hash collisions in schemaless decoding
    # CVE-2026-119195 pyasn1 Denial of Service via quadratic processing of fragmented ASN.1 data
    # CVE-2026-119196 pyasn1 Denial of Service via constructed bit string decoding
    # CVE-2026-119197 pyasn1 Denial of Service via quadratic complexity in binary REAL decoding
    # Pinning because it is a transitive dependency.
    "pyasn1>=0.6.5",
    # CVE-2026-129265 / GHSA-6q48-6c7w-9gw2 Distrust eMudhra intermediate CA certificates:
    # certifi before 2026.10.19 bundles emSign roots whose eMudhra intermediates have
    # compromised keys.
    # Pinning because it is a transitive dependency.
    "certifi>=2026.10.19",
    # CVE-2026-21226 Azure Core deserialization of untrusted data allows remote code
    # execution (fixed in 1.38.0).
    # Pinning because it is a transitive dependency.
    "azure-core>=1.38.0",
]
name = "kserve-storage"
version = "0.17.0"
readme = "README.md"
description = "KServe Storage Handler. This module is responsible to download the models from the provided source"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

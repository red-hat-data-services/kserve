[project]
authors = [
    {name = "The KServe Authors", email = "dsun20@bloomberg.net"},
    {name = "The KServe Authors", email = "fspolti@redhat.com"},
]
license = {text = "https://github.com/kserve/kserve/blob/master/LICENSE"}
requires-python = "<3.14,>=3.10"
dependencies = [
    # GHSA-6mq8-rvhq-8wgg, CVE-2025-69223 aiohttp HTTP parser auto_decompress zip bomb DoS
    # CVE-2026-34993 aiohttp arbitrary code execution via untrusted input to CookieJar.load()
    # CVE-2026-69244 aiohttp DoS via malformed HTTP responses (out-of-bounds heap read)
    # CVE-2026-111064 aiohttp DoS via missing initial request timeout
    # CVE-2026-111066 aiohttp DoS via file descriptor exhaustion in multipart request processing
    # CVE-2026-123817 aiohttp DoS via memory exhaustion during WebSocket frame reassembly
    "aiohttp<4.0.0,>=3.14.4",
    # CVE-2026-129265 / GHSA-6q48-6c7w-9gw2 distrust eMudhra intermediate CA certificates:
    # certifi before 2026.10.19 bundles emSign roots whose eMudhra intermediates have
    # compromised keys.
    # Pinning because it is a transitive dependency.
    "certifi>=2026.10.19",
    "requests<3.0.0,>=2.32.2",
    "google-cloud-storage<3.0.0,>=2.14.0",
    "azure-storage-blob<13.0.0,>=12.20.0",
    "azure-storage-file-share<13.0.0,>=12.16.0",
    "azure-identity<2.0.0,>=1.15.0",
    # The AWS_ENDPOINT_URL / AWS_ENDPOINT_URL_STS / AWS_ENDPOINT_URL_S3 endpoint
    # overrides that the storage-initializer resolves natively (and that the
    # KServe pod mutator copies from the serving container for IRSA and EKS
    # Pod Identity workloads) require botocore env-var endpoint overrides,
    # which are supported from 1.32.
    "boto3<2.0.0,>=1.32.0",
    # Distrust eMudhra intermediate CA certificates (bz#2563310): python-botocore before
    # 1.43.117 bundles the Comodo AAA Certificate Services root CA that chains to the
    # compromised eMudhra intermediates.
    # Pinning because it is a transitive dependency.
    "botocore>=1.43.117",
    # NOTE: the [hf-transfer] extra is intentionally dropped for hermetic Konflux
    # builds: hf-transfer is not onboarded to the AIPCC index. hf-xet (below) is the
    # onboarded accelerator and supersedes hf-transfer for Hub downloads.
    "huggingface-hub>=0.32.0",
    "hf-xet>=1.5.0",
    # Lightweight ModelScope download-only SDK (4 runtime deps), analogous to huggingface-hub.
    "modelscope-hub>=0.1.4",
    # CVE-2026-42563 Dulwich arbitrary code execution via malicious Git file paths during merge
    # CVE-2026-42305 Dulwich remote code execution via malicious Git repository (Windows path validation)
    "dulwich>=1.2.5",
    "oras<1.0.0,>=0.2.42",
    # Streaming decompressor for zstd-compressed oci+fetch:// image layers; stdlib tarfile
    # only gains native zstd in Python 3.14 and the storage-initializer runs 3.11.
    "zstandard>=0.21.0",
    "cryptography>=48.0.1", # GHSA-537c-gmf6-5ccf, PYSEC-2026-36
    # CVE-2026-32597 PyJWT accepts unknown `crit` header extensions (RFC 7515 §4.1.11 MUST violation)
    # Pinning because it is a transitive dependency.
    "pyjwt>=2.14.0,<2.15.0",
    # CVE-2026-30922 pyasn1 Vulnerable to Denial of Service via Unbounded Recursion
    # CVE-2026-59885 pyasn1 Quadratic complexity in OID processing allows DoS
    # CVE-2026-119194 pyasn1 DoS via hash collisions in schemaless decoding
    # CVE-2026-119195 pyasn1 DoS via quadratic processing of fragmented ASN.1 data
    # CVE-2026-119196 pyasn1 DoS via constructed bit string decoding
    # CVE-2026-119197 pyasn1 DoS via quadratic complexity in binary REAL decoding
    # Pinning because it is a transitive dependency.
    "pyasn1>=0.6.5",
    # CVE-2026-21226 Azure Core is vulnerable to deserialization of untrusted data
    # Pinning because it is a transitive dependency.
    "azure-core>=1.38.0",
    # GHSA-38jv-5279-wg99, CVE-2026-21441 urllib3 decompression-bomb bypass via HTTP redirects
    # Pinning because it is a transitive dependency.
    "urllib3>=2.8.0",
    # CVE-2026-112940 filelock: arbitrary file overwrite via insecure database file
    # reopening. Versions in the range >=3.20.4,<4.2.1 contain the CVE. The EA builds
    # shipped 3.32.3, which is inside that window, so this cap forces the unaffected
    # 3.20.3. To raise it past 3.20.3, jump directly to >=4.2.1 — note that requires
    # Python >=3.11 (the components still declare >=3.10 and CI tests 3.10) and a
    # filelock 4.x API-compatibility review.
    # Pinning because it is a transitive dependency.
    "filelock>=3.12.2,<3.20.4"
]
name = "kserve-storage"
version = "0.21.0"
readme = "README.md"
description = "KServe Storage Handler. This module is responsible to download the models from the provided source"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
confidential = ["jwcrypto>=1.5.0"]

[project.scripts]
kserve-decrypt = "kserve_storage.confidential.cli:main"

[project]
authors = [
    {name = "Michal Zabinski", email = "mzabinsk@redhat.com"},
    {name = "Dorota Laczak", email = "dlaczak@redhat.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "kserve",
    "kserve-storage",
    "autogluon.common==1.5.0+rhaiv.5",
    "autogluon.core==1.5.0+rhaiv.5",
    "autogluon.features==1.5.0+rhaiv.5",
    "autogluon.tabular[lightgbm,xgboost,tabm,fastai]==1.5.0+rhaiv.5",
    "autogluon.timeseries==1.5.0+rhaiv.5",
]
name = "autogluonserver"
version = "0.1.0"
description = "Model Server implementation for AutoGluon TabularPredictor and TimeSeriesPredictor. Not intended for use outside KServe Frameworks Images."
readme = "README.md"

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.2.0",
    "pytest-cov<5.0.0,>=4.0.0",
    "mypy<1.0,>=0.991",
    "pytest-asyncio<1.0.0,>=0.23.4",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]
rhoai-build = ["setuptools>=61.0", "wheel"]

[tool.uv.sources]
kserve = { path = "../kserve", editable = false }
kserve-storage = { path = "../storage", editable = false }
"autogluon.common" = { index = "aipcc" }
"autogluon.core" = { index = "aipcc" }
"autogluon.features" = { index = "aipcc" }
"autogluon.tabular" = { index = "aipcc" }
"autogluon.timeseries" = { index = "aipcc" }

[[tool.uv.index]]
name = "aipcc"
url = "https://console.redhat.com/api/pypi/public-rhai/rhoai/3.5/cpu-ubi9/simple/"
explicit = true
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "autogluon: autogluon server tests",
]

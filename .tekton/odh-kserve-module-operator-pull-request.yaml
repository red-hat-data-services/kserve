apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/kserve?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: '[pull_request]'
    pipelinesascode.tekton.dev/on-comment: '^/build-konflux'
    pipelinesascode.tekton.dev/on-target-branch: '[{{target_branch}}]'
  labels:
    appstudio.openshift.io/application: automation
    appstudio.openshift.io/component: pull-request-pipelines-odh-kserve-module-operator
    pipelines.appstudio.openshift.io/type: build
  name: odh-kserve-module-operator-on-pull-request-{{pull_request_number}}
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-kserve-module-operator-{{revision}}
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux.kserve-module-controller
  - name: path-context
    value: .
  - name: image-expires-after
    value: 5d
  - name: enable-slack-failure-notification
    value: "false"
  - name: prefetch-input
    value: |
      [{"type": "rpm", "path": "."}, {"type": "gomod", "path": "kserve-module/"}]
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # Pinned rather than '{{ target_branch }}' - same reason as in
    # odh-kserve-controller-pull-request.yaml: konflux-central has no
    # test-gap branch, so the resolver 404s and the PipelineRun is never
    # created.  test-gap is an identical copy of rhoai-3.6.
    #
    # This one matters most for the early gate.  It is the only kserve PR
    # pipeline with no on-label gate, so it is the one that builds when a PR
    # is simply opened - which is what gives the gate a PR image to resolve
    # without anyone having to label or comment first.
    - name: revision
      value: 'rhoai-3.6'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-pull-request-pipelines
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 8h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'

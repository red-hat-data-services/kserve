name: Update RHOAI AutoGluon artifacts

on:
  push:
    branches: [main]
    paths:
      - python/autogluonserver/pyproject.toml
      - python/autogluonserver/rhoai-overrides.toml
      - python/autogluonserver/autogluonserver/**
      - python/kserve/**
      - python/storage/**
      - python/pyproject.toml
      - python/third_party/pip-licenses.py
      - hack/rhoai/generate_autogluon.py
      - Dockerfiles/autogluon.Dockerfile.konflux
      - kserve-deps.env
      - .github/workflows/autogluon-rhoai-update.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autogluon-rhoai-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RHDS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RHDS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kserve

      - name: Check out KServe main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.7.8

      - name: Generate RHOAI artifacts
        run: |
          uv run hack/rhoai/generate_autogluon.py \
            --base python/autogluonserver/pyproject.toml \
            --overlay python/autogluonserver/rhoai-overrides.toml \
            --output-dir python/autogluonserver \
            --source-commit "$GITHUB_SHA"

      - name: Commit generated artifacts
        env:
          TARGET_BRANCH: main
        run: |
          GENERATED=(
            python/autogluonserver/pyproject.rhoai.toml
            python/autogluonserver/uv.rhoai.lock
            python/autogluonserver/autogluon-all-requirements.txt
            python/autogluonserver/rhoai-generation.toml
          )
          git add -- "${GENERATED[@]}"
          if git diff --staged --quiet; then
            echo "RHOAI AutoGluon artifacts are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(autogluon): regenerate RHOAI artifacts" \
            -m "Source: ${GITHUB_SHA}"

          MAX_RETRIES=5
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            if git push origin "$TARGET_BRANCH"; then
              echo "Generated artifact push succeeded (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              git pull --rebase origin "$TARGET_BRANCH"
            fi
          done
          echo "ERROR: generated artifact push failed after ${MAX_RETRIES} attempts" >&2
          exit 1
